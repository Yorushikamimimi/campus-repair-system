<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1900" viewBox="0 0 3000 1900">
  <defs>
    <marker id="arrow0" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#27323a"/>
    </marker>
    <style>
      .title { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:58px; font-weight:600; fill:#18232b; text-anchor:middle; dominant-baseline:middle; }
      .entity { fill:#fff; stroke:#33414a; stroke-width:4; }
      .process { fill:#f6f8f9; stroke:#27323a; stroke-width:5; }
      .node-text { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:43px; font-weight:500; fill:#18232b; text-anchor:middle; dominant-baseline:middle; }
      .process-id { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:48px; font-weight:600; fill:#18232b; text-anchor:middle; dominant-baseline:middle; }
      .process-name { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:46px; font-weight:500; fill:#18232b; text-anchor:middle; dominant-baseline:middle; }
      .flow { fill:none; stroke:#27323a; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow0); }
      .flow-label { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:31px; font-weight:400; fill:#18232b; text-anchor:middle; dominant-baseline:middle; paint-order:stroke fill; stroke:#fff; stroke-width:12; stroke-linejoin:round; }
    </style>
  </defs>
  <rect x="0" y="0" width="3000" height="1900" fill="#fff"/>
  <text class="title" x="1500" y="80">校园报修工单管理系统0层数据流图</text>

  <!-- 报修人与总加工之间的数据流 -->
  <path class="flow" d="M550 390 H986"/>
  <path class="flow" d="M550 480 H986"/>
  <path class="flow" d="M550 570 H986"/>
  <path class="flow" d="M550 660 H986"/>
  <path class="flow" d="M1000 800 H564"/>
  <path class="flow" d="M1000 890 H564"/>
  <path class="flow" d="M1000 980 H564"/>
  <path class="flow" d="M1000 1070 H564"/>

  <!-- 管理员与总加工之间的数据流 -->
  <path class="flow" d="M2450 360 H2014"/>
  <path class="flow" d="M2450 430 H2014"/>
  <path class="flow" d="M2450 500 H2014"/>
  <path class="flow" d="M2450 570 H2014"/>
  <path class="flow" d="M2450 640 H2014"/>
  <path class="flow" d="M2000 760 H2436"/>
  <path class="flow" d="M2000 840 H2436"/>
  <path class="flow" d="M2000 920 H2436"/>
  <path class="flow" d="M2000 1000 H2436"/>

  <!-- 维修人员与总加工之间的数据流 -->
  <path class="flow" d="M1150 1500 V1154"/>
  <path class="flow" d="M1350 1500 V1154"/>
  <path class="flow" d="M1650 1140 V1486"/>
  <path class="flow" d="M1850 1140 V1486"/>

  <!-- 外部实体：恰好三个 -->
  <rect class="entity" x="100" y="330" width="450" height="820"/>
  <text class="node-text" x="325" y="740">E1 报修人</text>

  <rect class="entity" x="2450" y="300" width="450" height="850"/>
  <text class="node-text" x="2675" y="725">E2 管理员</text>

  <rect class="entity" x="1000" y="1500" width="1000" height="200"/>
  <text class="node-text" x="1500" y="1600">E3 维修人员</text>

  <!-- 唯一总加工 -->
  <rect class="process" x="1000" y="300" width="1000" height="840" rx="120" ry="120"/>
  <text class="process-id" x="1500" y="660">P0</text>
  <text class="process-name" x="1500" y="755">校园报修工单管理系统</text>

  <!-- 报修人数据流名称 -->
  <text class="flow-label" x="775" y="365">报修申请信息</text>
  <text class="flow-label" x="775" y="455">验收、返修与评价信息</text>
  <text class="flow-label" x="775" y="545">查询请求</text>
  <text class="flow-label" x="775" y="635">登录信息</text>
  <text class="flow-label" x="775" y="775">提交结果</text>
  <text class="flow-label" x="775" y="865">工单进度信息</text>
  <text class="flow-label" x="775" y="955">维修结果信息</text>
  <text class="flow-label" x="775" y="1045">登录结果</text>

  <!-- 管理员数据流名称 -->
  <text class="flow-label" x="2225" y="335">审核处理信息</text>
  <text class="flow-label" x="2225" y="405">派单操作信息</text>
  <text class="flow-label" x="2225" y="475">统计查询请求</text>
  <text class="flow-label" x="2225" y="545">登录信息</text>
  <text class="flow-label" x="2225" y="615">用户与维修人员管理信息</text>
  <text class="flow-label" x="2225" y="735">待审核工单信息</text>
  <text class="flow-label" x="2225" y="815">统计结果信息</text>
  <text class="flow-label" x="2225" y="895">登录结果</text>
  <text class="flow-label" x="2225" y="975">用户与维修人员信息</text>

  <!-- 维修人员数据流名称 -->
  <text class="flow-label" x="1150" y="1330">维修处理信息</text>
  <text class="flow-label" x="1350" y="1400">登录信息</text>
  <text class="flow-label" x="1650" y="1330">维修任务信息（含返修任务）</text>
  <text class="flow-label" x="1850" y="1400">登录结果</text>
</svg>

      .call { fill:none; stroke:#2f4655; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#call-arrow); }
      .bridge { fill:none; stroke:#fff; stroke-width:13; stroke-linecap:round; stroke-linejoin:round; }
      .note { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; font-size:30px; font-weight:400; fill:#526672; text-anchor:middle; dominant-baseline:middle; }

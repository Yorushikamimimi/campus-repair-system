spring:
  application:
    name: campus-repair-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-before-deployment-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
